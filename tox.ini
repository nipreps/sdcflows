[tox]
requires =
  tox>=4
  tox-uv
envlist =
  py3{12,13,14}-latest-{fast,slow,veryslow}
  py312-min-fast
  py3{13,14}-pre-{fast,slow,veryslow}
  spellcheck
skip_missing_interpreters = true

# Configuration that allows us to split tests across GitHub runners effectively
[gh-actions]
python =
  3.12: py312
  3.13: py313
  3.14: py314

[gh-actions:env]
DEPENDS =
  min: min
  latest: latest
  pre: pre

MARKS =
  fast: fast
  slow: slow
  veryslow: veryslow

[testenv]
description = Pytest with coverage
labels = test
pip_pre =
  pre: true
pass_env =
  TEMPLATEFLOW_HOME
  # Freesurfer variables searched for
  FREESURFER_HOME
  SUBJECTS_DIR
  FS_LICENSE
  # FSL
  FSLOUTPUTTYPE
  FSLMULTIFILEQUIT
  # AFNI
  AFNI_HOME
  AFNI_MODELPATH
  AFNI_IMSAVE_WARNINGS
  AFNI_TTATLAS_DATASET
  AFNI_PLUGINPATH
  # CI variables
  TEST_DATA_HOME
  TEST_OUTPUT_DIR
  TEST_WORK_DIR
  FMRIPREP_REGRESSION_SOURCE
  CACHED_WORK_DIRECTORY
  # CircleCI-specific
  CIRCLE_NPROCS
  SAVE_CIRCLE_ARTIFACTS
  # getpass.getuser() sources for Windows:
  LOGNAME
  USER
  LNAME
  USERNAME
  # Pass user color preferences through
  PY_COLORS
  FORCE_COLOR
  NO_COLOR
  CLICOLOR
  CLICOLOR_FORCE
  PYTHON_GIL
extras = tests
setenv =
  pre: PIP_EXTRA_INDEX_URL=https://pypi.anaconda.org/scientific-python-nightly-wheels/simple
  pre: UV_INDEX=https://pypi.anaconda.org/scientific-python-nightly-wheels/simple
  pre: UV_INDEX_STRATEGY=unsafe-best-match
uv_resolution =
  min: lowest-direct

commands =
  pytest --durations=20 --durations-min=1.0 --cov-report term-missing \
  fast: -m "not slow" \
  slow: -m "slow and not veryslow" \
  veryslow: -m "veryslow" \
  {posargs:-n auto}

[testenv:spellcheck]
description = Check spelling
labels = check
deps =
  codespell[toml]
skip_install = true
commands =
  codespell . {posargs}

[testenv:build{,-strict}]
labels =
  check
  pre-release
deps =
  build
  twine
skip_install = true
set_env =
  # Ignore specific known warnings:
  # https://github.com/pypa/pip/issues/11684
  # https://github.com/pypa/pip/issues/12243
  strict: PYTHONWARNINGS=error,once:pkg_resources is deprecated as an API.:DeprecationWarning:pip._internal.metadata.importlib._envs,once:Unimplemented abstract methods {'locate_file'}:DeprecationWarning:pip._internal.metadata.importlib._dists
commands =
  python -m build
  python -m twine check dist/*

[testenv:publish]
depends = build
labels = release
deps =
  twine
skip_install = true
commands =
  python -m twine upload dist/*
